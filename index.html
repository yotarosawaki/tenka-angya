// ---------------- ドット絵描画（低解像度レイヤーとスプライト） ----------------
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const wcv=mk(480,270),wctx=wcv.getContext('2d');
const SPR_W=300,SPR_H=200,SPR_OX=150,SPR_OY=174;
const spr=mk(SPR_W,SPR_H),sctx=spr.getContext('2d'),sil=mk(SPR_W,SPR_H),silx=sil.getContext('2d'),wsil=mk(SPR_W,SPR_H),wsx=wsil.getContext('2d');
function silhouette(c,col){c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='copy';c.drawImage(spr,0,0);c.globalCompositeOperation='source-in';c.fillStyle=col;c.fillRect(0,0,SPR_W,SPR_H);c.globalCompositeOperation='source-over';}
// fn を半分の解像度で描き、黒い輪郭線をつけて現在の ctx に貼る
function sprite(fn,ox,oy,opt){
  const tgt=ctx;opt=opt||{};
  sctx.setTransform(1,0,0,1,0,0);sctx.clearRect(0,0,SPR_W,SPR_H);sctx.setTransform(.5,0,0,.5,SPR_OX,SPR_OY);
  ctx=sctx;fn();ctx=tgt;
  silhouette(silx,opt.outline||'#140a06');
  const x=ox-SPR_OX*2,y=oy-SPR_OY*2,w=SPR_W*2,h=SPR_H*2;
  tgt.save();tgt.imageSmoothingEnabled=false;tgt.globalAlpha=opt.alpha!=null?opt.alpha:1;
  tgt.drawImage(sil,x-2,y,w,h);tgt.drawImage(sil,x+2,y,w,h);tgt.drawImage(sil,x,y-2,w,h);tgt.drawImage(sil,x,y+2,w,h);
  tgt.drawImage(spr,x,y,w,h);
  if(opt.flash){silhouette(wsx,'#fff');tgt.globalAlpha*=.7;tgt.drawImage(wsil,x,y,w,h);}
  tgt.restore();
}
function worldLayer(fn){ctx=wctx;wctx.setTransform(1,0,0,1,0,0);wctx.clearRect(0,0,480,270);wctx.setTransform(.5,0,0,.5,0,0);fn();ctx=mctx;mctx.setTransform(1,0,0,1,0,0);mctx.imageSmoothingEnabled=false;mctx.drawImage(wcv,0,0,W,H);}

// ---------------- 描画ヘルパー ----------------
const _sh={};
function shade(c,f){const k=c+f;if(_sh[k])return _sh[k];const n=parseInt(c.slice(1),16);const r=clamp(Math.round((n>>16&255)*f),0,255),g=clamp(Math.round((n>>8&255)*f),0,255),b=clamp(Math.round((n&255)*f),0,255);return _sh[k]='rgb('+r+','+g+','+b+')';}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function poly(pts,col){if(col)ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill();}
function circ(x,y,r,col){if(col)ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function ell(x,y,rx,ry,col,rot){if(col)ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);ctx.fill();}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function text(s,x,y,size,col,align,font,stroke,sw){ctx.font='bold '+size+'px '+(font||GOTH);ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke!==null){ctx.lineJoin='round';ctx.lineWidth=sw||Math.max(3,size/6);ctx.strokeStyle=stroke||'#000';ctx.strokeText(s,x,y);}ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function star(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r2=i%2?r*.35:r;ctx.lineTo(x+Math.cos(a)*r2,y+Math.sin(a)*r2);}ctx.closePath();ctx.fill();}
function glow(x,y,r,col){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}

// ---------------- 入力 ----------------
const keys={},latch={};
const KEYMAP={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],up:['ArrowUp','KeyW'],down:['ArrowDown','KeyS'],atk:['KeyJ','KeyZ'],jump:['KeyK','KeyX','Space'],sp:['KeyL','KeyC'],start:['Enter','Escape','KeyP']};
const held={},prev={},touchIn={};let tapped=false;
addEventListener('keydown',e=>{
  if(e.code==='KeyM'&&!e.repeat){muted=!muted;if(master)master.gain.value=muted?0:.5;}
  if(!keys[e.code])latch[e.code]=true;keys[e.code]=true;audioInit();
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function poll(){for(const n in KEYMAP){prev[n]=held[n];held[n]=KEYMAP[n].some(c=>keys[c]||latch[c])||!!touchIn[n]||!!latch['T_'+n];}for(const k in latch)delete latch[k];}
const pr=n=>held[n]&&!prev[n];
function confirmPressed(){if(tapped){tapped=false;return true;}return pr('atk')||pr('start');}

const isTouch=matchMedia('(pointer:coarse)').matches;
if(isTouch)document.getElementById('touch').style.display='block';
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null;
function stickSet(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy),mx=r.width*.36;if(m>mx){dx*=mx/m;dy*=mx/m;}knob.style.transform='translate('+dx+'px,'+dy+'px)';const th=r.width*.11;
  for(const [n,v] of [['left',dx<-th],['right',dx>th],['up',dy<-th],['down',dy>th]]){if(v&&!touchIn[n])latch['T_'+n]=true;touchIn[n]=v;}}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickSet(e);audioInit();e.preventDefault();});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickSet(e);});
const stickEnd=e=>{if(e.pointerId!==stickId)return;stickId=null;knob.style.transform='';touchIn.left=touchIn.right=touchIn.up=touchIn.down=false;};
stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);
function bindBtn(id,name){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{touchIn[name]=true;latch['T_'+name]=true;b.setPointerCapture(e.pointerId);audioInit();e.preventDefault();});const up=()=>{touchIn[name]=false;};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);}
bindBtn('tA','atk');bindBtn('tJ','jump');bindBtn('tS','sp');bindBtn('tP','start');
cv.addEventListener('pointerdown',e=>{audioInit();const r=cv.getBoundingClientRect();onCanvasTap((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);});

let AC=null,master=null,muted=false,nbuf=null;
function audioInit(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;if(pendingBgm)pendingBgm();}if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,dur,type,vol,f2,at){if(!AC||muted)return;const t=at||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,freq,at,q){if(!AC||muted)return;const t=at||AC.currentTime;const s=AC.createBufferSource();s.buffer=nbuf;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=freq;fl.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}

const BGM={on:false,pat:null,step:0,next:0,tempo:.16,root:62};let pendingBgm=null;
function mkPat(seed){let s=(seed*9301+49297)%2147483647;const r=()=>(s=(s*16807)%2147483647)/2147483647;const sc=[-12,-7,-5,0,1,5,7,8,12,13,17,19];let i=4;const m=[];for(let k=0;k<32;k++){if(k%8===7||r()<.28)m.push(null);else{i=clamp(i+Math.floor(r()*5)-2,1,sc.length-1);m.push(sc[i]);}}return m;}
function bgmPlay(seed,tempo,root){const go=()=>{BGM.on=true;BGM.pat=mkPat(seed);BGM.tempo=tempo;BGM.root=root||62;BGM.step=0;BGM.next=AC.currentTime+.1;pendingBgm=null;};if(AC)go();else pendingBgm=go;}
function bgmStop(){BGM.on=false;pendingBgm=null;}
function bgmTick(){if(!AC||!BGM.on)return;while(BGM.next<AC.currentTime+.15){const t=BGM.next,k=BGM.step%32,n=BGM.pat[k];
  if(n!=null){const f=440*Math.pow(2,(BGM.root+n-69)/12);tone(f,BGM.tempo*1.8,'triangle',.07,0,t);tone(f*2,BGM.tempo*.5,'square',.012,0,t);}
  if(k%8===0){tone(95,.3,'sine',.32,45,t);noise(.12,.12,200,t);}else if(k%8===4){tone(120,.15,'sine',.16,60,t);}
  if(k%4===2)noise(.04,.04,5000,t,3);
  if(k%16===14||k%16===15)tone(110,.12,'sine',.16,55,t);
  BGM.next+=BGM.tempo;BGM.step++;}}

function getPose(e){
  const w=e.look.weapon;
  const p={lF:5,lB:-5,kF:6,kB:6,lean:0,arm:70,armLen:22,wpn:IDLE_W[w],arm2:85,arm2Len:20,flip:false,bob:Math.sin(e.anim*.08)*1.2,crouch:0,lie:0,trail:null,ring:0};
  if(w==='gun'){p.arm=40;p.arm2=35;p.arm2Len=18;}
  if(w==='none'){p.arm=60;p.arm2=75;}
  const st=e.state;
  if(st==='walk'){const s=Math.sin(e.anim*.25);p.lF=s*28;p.lB=-s*28;p.kF=s<0?25:8;p.kB=s>0?25:8;p.bob=Math.abs(Math.cos(e.anim*.25))*2.5;p.arm2=85-s*20;}
  else if(st==='run'){const s=Math.sin(e.anim*.42);p.lF=s*42;p.lB=-s*42;p.kF=s<0?55:10;p.kB=s>0?55:10;p.lean=16;p.arm2=50-s*40;p.bob=Math.abs(Math.cos(e.anim*.42))*3;}
  else if(st==='hurt'||st==='grabbed'){p.lean=-16;p.arm2=-40;p.lF=10;p.lB=-20;p.bob=0;}
  else if(st==='lifted'){p.lie=1;p.arm2=-150;p.lF=20;p.kF=40;p.bob=0;}
  else if(st==='down'||st==='dying'||st==='dead'){p.lie=e.y>3?.55:1;p.arm2=-160;p.lF=10;p.lB=-5;p.bob=0;}
  else if(st==='grab'){p.arm2=0;p.arm2Len=26;p.lF=15;p.lB=-12;p.lean=4;}

  if(e.knee>0){p.lF=78;p.kF=112;p.lean=8;p.arm2=10;p.arm2Len=24;}

}

function attackPose(p,e,a,t){
  const h0=Math.max(1,a.hit[0]),h1=Math.max(h0+1,a.hit[1]);

  switch(a.anim){
    case 'slashH':sw(-150,35,-8,12);p.lF=22;p.lB=-18;break;
    case 'slashUp':sw(80,-115,5,-8);p.lF=18;p.lB=-14;break;
    case 'slashDown':sw(-135,75,-10,18);p.lF=24;p.lB=-20;if(ph>0)p.crouch=3;break;
    case 'thrust':p.wpn=ph===0?-5:0;p.arm=ph===0?20:-2;p.armLen=ph===0?12:28;p.lean=ph===0?-6:16;p.lF=30;p.kF=20;p.lB=-26;if(ph===1)p.thrustFx=true;break;

function fighterBody(e){

  ctx.scale(e.face*(p.flip?-1:1)*s,s);
  if(p.lie){ctx.translate(0,-4);ctx.rotate(-Math.PI/2*p.lie);}
  ctx.translate(0,p.crouch-p.bob);
  const hipY=-42,sleeve=!L.armor&&!L.bare;
  if(e.def&&e.def.cape)drawCape();
  drawLeg(-3,hipY,p.lB,p.kB,shade(L.pants,.7),L);
  ctx.save();ctx.translate(0,hipY);ctx.rotate(D(p.lean));ctx.translate(0,-hipY);
  const bh=drawArm(-4,-70,p.arm2,p.arm2Len,L.bare?shade(L.skin,.8):shade(L.body,.7),L.skin,sleeve);
  ctx.restore();
  drawLeg(3,hipY,p.lF,p.kF,L.pants,L);
  ctx.save();ctx.translate(0,hipY);ctx.rotate(D(p.lean));ctx.translate(0,-hipY);
  drawTorso(L);drawHead(L);
  if(p.cast)glow(bh[0],bh[1],26+Math.sin(T*.5)*4,'rgba(255,90,40,.9)');
  const sx=3,sy=-70,hx=sx+Math.cos(D(p.arm))*p.armLen,hy=sy+Math.sin(D(p.arm))*p.armLen;
  const w=L.weapon,isP=e.kind==='player'||e.isDemo;
  if(p.trail){const R=p.armLen*.5+(WLEN[w]||20)*.85+8,a0=D(p.trail[0]),a1=D(p.trail[1]);
    ctx.strokeStyle=isP?'rgba(255,255,255,.5)':'rgba(255,110,90,.45)';ctx.lineWidth=16;ctx.beginPath();ctx.arc(sx,sy,R,Math.min(a0,a1),Math.max(a0,a1));ctx.stroke();
    ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.stroke();}
  if(p.ring){const R=(WLEN[w]||30)+22;ctx.strokeStyle=isP?'rgba(255,255,255,.6)':'rgba(255,110,90,.5)';ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(0,-52,R,15,0,0,Math.PI*2);ctx.stroke();}
  if(w!=='none'){ctx.save();ctx.translate(hx,hy);ctx.rotate(D(p.wpn));drawWeapon(w,!!e.tell,e.atk&&e.atk.anim==='aim');
    if(p.thrustFx){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2.5;for(let i=-1;i<=1;i++)line(WLEN[w]+6,i*6,WLEN[w]+26+Math.random()*10,i*6);}
    ctx.restore();}
  else if(e.tell){star(hx+6,hy,9,'rgba(255,70,50,.95)');}
  drawArm(sx,sy,p.arm,p.armLen,L.bare?L.skin:L.body,L.skin,sleeve);
  ctx.restore();
}
function drawFighter(e,ox,oy){
  let alpha=1;

}

  if((type==='ashigaru'||type==='archer')&&STAGES[G.stage].tint)e.look.body=STAGES[G.stage].tint;

// ---------- 物理 ----------
function airPhys(e){
  if(e.y>0||e.vy>0){e.y+=e.vy;e.vy-=GRAV;e.x+=e.vx;e.z+=e.vz;if(e.y<=0){e.y=0;e.vy=0;e.vx=0;e.vz=0;e.justLanded=true;}}
  else if(e.vx){e.x+=e.vx;e.vx*=.82;if(Math.abs(e.vx)<.1)e.vx=0;}
  e.z=clamp(e.z,ZMIN,ZMAX);
}
function knockDown(e,dir,kb){e.state='down';e.vy=5.5+kb*.25;e.vx=dir*(2+kb*.5);e.vz=0;e.y=Math.max(e.y,1);e.downT=e.hp<=0?30:45;e.grounded=false;e.atk=null;e.airAtk=false;e.tell=false;e.knee=0;}
function updDown(e){airPhys(e);if(e.y<=0){if(!e.grounded){e.grounded=true;dust(e.x,e.z,6);if(e.thrown){e.thrown=false;G.shake=Math.max(G.shake,6);SFX.heavy();}else if(e.kind==='enemy'&&e.def.boss)G.shake=Math.max(G.shake,6);}e.downT--;return e.downT<=0;}return false;}
function dismount(r){const h=r.horse;if(!h)return;h.rider=null;h.state='idle';h.t=0;h.moving=false;h.vx=h.face*3;r.horse=null;r.cav=null;SFX.neigh();}

// ---------- 攻撃 ----------
function canHit(e,a,t){
  if(t.kind==='prop'){if(t.broken)return false;}
  else if(t.state==='down'||t.state==='dying'||t.state==='dead'||t.state==='lifted'||t.inv>0)return false;
  const dx=(t.x-e.x)*e.face/SIZE,tw=(t.w||18)/SIZE;
  if(dx<a.range[0]-tw||dx>a.range[1]+tw)return false;
  if(Math.abs(t.z-e.z)>(a.zr||22)*(e.scale||1))return false;
  if(Math.abs((t.y||0)-e.y)>(a.yr||55)*SIZE)return false;
  return true;
}
function runAttack(e,targets,isPlayer){
  const a=e.atk;e.atkT++;const t=e.atkT,h0=a.hit[0],h1=a.hit[1];
  if(t===1&&isPlayer&&a.dmg>0)SFX.swing();
  if(!isPlayer&&t===h0&&a.dmg>0)SFX.swing();
  if(a.lunge&&t>=h0-2&&t<=h1)e.x+=a.lunge*e.face;
  if(a.hop&&t===h0)e.vy=a.hop;
  if(a.proj)for(const q of a.proj)if(q.t===t)spawnProj(q.type,e,q);
  if(a.warp&&t===a.warp)doWarp(e);
  if(a.heavy&&t===h0){G.shake=Math.max(G.shake,a.quake?16:6);dust(e.x+e.face*60*(e.scale||1),e.z,8);}
  if(a.dmg>0&&t>=h0&&t<=h1){
    if(a.multi&&t>h0&&(t-h0)%a.multi===0)e.hitSet.clear();
    for(const tg of targets){if(e.hitSet.has(tg))continue;if(canHit(e,a,tg)){e.hitSet.add(tg);if(isPlayer)hitByPlayer(e,tg,a);else hitPlayer(e,a);}}
  }
}
function hitByPlayer(src,t,a){if(t.kind==='prop')breakProp(t);else hitEnemy(src,t,a);}

function hitEnemy(src,e,a){
  if(e.dead)return;
  e.hp-=a.dmg;e.flash=6;G.score+=a.dmg*10;G.hits++;G.hitT=80;G.target=e;G.targetT=150;
  const dir=src.x<e.x?1:-1,s=e.scale||1;
  hitFx(e.x-dir*8,e.z-e.y-52*s*SIZE-(e.horse?RIDE_H:0),a.heavy||a.down);
  G.hitstop=Math.max(G.hitstop,(a.heavy||a.down)?6:3);if(a.heavy)G.shake=Math.max(G.shake,7);
  (a.heavy||a.down?SFX.heavy:SFX.hit)();
  let fall=false;
  if(e.horse){e.rideHits++;if(e.hp>0&&!a.down&&e.rideHits<2)return;dismount(e);fall=true;popText('落馬！',e.x,e.z-200,'#ffd34d');}
  if(e.hp<=0){e.hp=0;if(e.state!=='attack'||!e.def.boss)e.face=-dir;knockDown(e,dir,Math.max(a.kb||0,6));onEnemyKilled(e);return;}
  if(e.def.boss){
    if(e.state==='attack'||e.superT>0)return;
    e.face=-dir;e.stunHits++;e.lastHitT=60;
    if(e.stunHits>=6){e.stunHits=0;e.superT=100;e.cd=0;return;}
    if(a.down&&e.bossDownCD<=0){knockDown(e,dir,a.kb*.6);e.bossDownCD=220;}
    else{e.state='hurt';e.hitstun=a.down?14:7;e.vx=dir*(a.kb||1)*.3;}
    return;
  }
  e.face=-dir;
  if(a.down||fall)knockDown(e,dir,Math.max(a.kb||0,4));
  else{e.state='hurt';e.hitstun=e.def.heavy?10:18;e.vx=dir*(a.kb||1)*(e.def.heavy?.4:1);e.atk=null;e.tell=false;}
}
function onEnemyKilled(e){
  if(e.dead)return;e.dead=true;
  const d=e.def;G.score+=d.score;
  if(d.boss){G.clearT=1;G.slow=90;SFX.ko();bgmStop();
    for(const o of enemies)if(o!==e&&o.hp>0){if(o.horse)dismount(o);o.hp=0;o.dead=true;knockDown(o,o.x<P.x?-1:1,5);G.score+=o.def.score;}}
  else if(Math.random()<.16)spawnItem(pick(['onigiri','onigiri','nikuman','koban']),e.x,e.z);
}
function hitPlayer(src,a){
  const p=P;if(p.inv>0||p.state==='down'||p.state==='dead'||p.state==='special'||G.clearT)return;
  const dmg=Math.round(a.dmg*(1+.08*G.stage));p.hp=Math.max(0,p.hp-dmg);p.flash=8;
  G.shake=Math.max(G.shake,5);G.hitstop=Math.max(G.hitstop,4);G.hits=0;SFX.hurt();
  hitFx(p.x,p.z-p.y-55*SIZE-(p.horse?RIDE_H:0),false,'#ff6b6b');
  const dir=src.x<p.x?1:-1;p.face=-dir;p.atk=null;p.airAtk=false;p.knee=0;
  if(p.grab){const e=p.grab;if(e.state==='grabbed'||e.state==='lifted'){e.state='idle';e.cd=30;}p.grab=null;}
  let fall=false;if(p.horse){dismount(p);fall=true;}
  if(p.hp<=0||a.down||p.y>0||fall)knockDown(p,dir,Math.max(a.kb||3,4));
  else{p.state='hurt';p.hitstun=18;p.vx=dir*(a.kb||2);p.inv=20;}
}
function doWarp(e){SFX.warp();for(let i=0;i<10;i++)parts.push({type:'smoke',x:e.x+rnd(-20,20),y:e.z-rnd(0,110),vx:0,vy:-.5,g:0,life:30,max:30,size:rnd(8,16),color:'rgba(80,60,110,'});

// ---------- 飛び道具 ----------
function spawnProj(type,o,q){
  const d=PD[type],dir=(d.back?-1:1)*(q.back?-1:1)*o.face,s=(o.scale||1)*SIZE;
  projs.push({type,d,x:o.x+dir*30*s,z:o.z,h:d.h>20?d.h*s:d.h,vx:dir*d.spd,vz:q.vz||0,life:d.life,t:0,hit:new Set(),dir});
  if(type==='shuriken'||type==='eshuriken'||type==='arrow')SFX.throwS();
  else if(type==='bullet'){SFX.shot();for(let i=0;i<5;i++)parts.push({type:'smoke',x:o.x+dir*70*s,y:o.z-d.h*s,vx:dir*rnd(.5,2),vy:-rnd(.2,1),g:0,life:25,max:25,size:rnd(5,10),color:'rgba(220,220,220,'});}
  else if(type.indexOf('wave')>=0)SFX.wave();
  else if(type==='fireball')SFX.fire();
}
function updProjs(){
  for(const p of projs){
    p.x+=p.vx;p.z+=p.vz;p.life--;p.t++;
    if(p.d.home){p.vz+=clamp(P.z-p.z,-1,1)*.05;p.vz=clamp(p.vz,-1.6,1.6);if(T%2)parts.push({type:'smoke',x:p.x,y:p.z-p.h,vx:-p.vx*.2,vy:-.5,g:0,life:16,max:16,size:rnd(6,12),color:'rgba(255,120,40,'});}
    if(p.type.indexOf('wave')>=0&&p.t%3===0)parts.push({type:'shard',x:p.x,y:p.z-rnd(0,20),vx:rnd(-1,1),vy:-rnd(2,5),g:.3,life:22,max:22,size:4,color:p.d.team?'#a33':'#bcd'});
    if(p.z<ZMIN-40||p.z>ZMAX+30)p.life=0;
    const tg=p.d.team===0?enemies.concat(props):[P];
    for(const t of tg){
      if(p.hit.has(t))continue;
      if(t.kind==='prop'){if(t.broken)continue;}else if(t.state==='down'||t.state==='dying'||t.state==='dead'||t.state==='lifted'||t.inv>0)continue;
      const ts=(t.scale||1)*SIZE;
      if(Math.abs(t.z-p.z)>(p.d.zr||20))continue;if(Math.abs(t.x-p.x)>(t.w||18)+p.d.r)continue;
      const ty=t.y||0;if(p.h<ty-5||p.h>ty+(100+(t.horse?50:0))*ts)continue;
      p.hit.add(t);const a={dmg:p.d.dmg,kb:p.d.kb,down:p.d.down};
      if(p.d.team===0){if(t.kind==='prop')breakProp(t);else hitEnemy(p,t,a);}else hitPlayer(p,a);
      if(!p.d.pierce){p.life=0;break;}
    }
    if(p.x<G.camX-150||p.x>G.camX+W+150)p.life=0;
  }
  projs=projs.filter(p=>p.life>0);
}
function drawProj(p){
  const x=p.x-G.camX,y=p.z-p.h;
  ell(x,p.z,10,3,'rgba(0,0,0,.25)');
  switch(p.type){
    case 'shuriken':case 'eshuriken':ctx.save();ctx.translate(x,y);ctx.rotate(p.t*.6);star(0,0,11,'#222');star(0,0,9,p.type==='shuriken'?'#d8e2ea':'#7a8090');ctx.restore();break;

    case 'arrow':ctx.strokeStyle='#3a2a1a';ctx.lineWidth=3;line(x-p.dir*30,y,x,y);poly([[x,y-4],[x+p.dir*9,y],[x,y+4]],'#ddd');ctx.fillStyle='#e8e0cc';ctx.fillRect(x-p.dir*30-3,y-4,6,8);break;
    case 'fireball':glow(x,y,30,'rgba(255,120,30,.8)');circ(x,y,11+Math.sin(p.t*.5)*2,'#ffb030');circ(x,y,6,'#fff6c0');break;
    default:{const col=p.d.team?['rgba(255,80,40,0)','rgba(255,90,40,.9)']:['rgba(150,210,255,0)','rgba(200,235,255,.95)'];
      const hgt=60+Math.sin(p.t*.6)*8,g=ctx.createLinearGradient(0,p.z-hgt,0,p.z);g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);ctx.fillStyle=g;

  }
}

function hitFx(x,y,big,col){parts.push({type:'flash',x,y,life:big?10:7,max:big?10:7,size:big?46:30,color:col||'#fff'});
  for(let i=0;i<(big?14:7);i++){const a=rnd(0,Math.PI*2),v=rnd(3,big?11:7);parts.push({type:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.2,life:14,max:14,size:2,color:col||'#ffe27a'});}}
function dust(x,z,n){for(let i=0;i<n;i++)parts.push({type:'smoke',x:x+rnd(-20,20),y:z-rnd(0,8),vx:rnd(-2,2),vy:-rnd(.2,1.2),g:0,life:26,max:26,size:rnd(6,12),color:'rgba(200,190,170,'});}
function popText(s,x,y,col){parts.push({type:'txt',s,x,y,vx:0,vy:-1,g:0,life:60,max:60,size:20,color:col});}
function updParts(){for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;}parts=parts.filter(p=>p.life>0);}
function drawParts(){for(const p of parts){const x=p.x-G.camX,k=p.life/p.max;
  if(p.type==='flash'){ctx.globalAlpha=k;star(x,p.y,p.size*(1.3-k*.5),p.color);ctx.globalAlpha=1;}
  else if(p.type==='spark'){ctx.strokeStyle=p.color;ctx.lineWidth=3;line(x,p.y,x-p.vx*2,p.y-p.vy*2);}
  else if(p.type==='smoke'){ctx.fillStyle=p.color+(k*.5)+')';circ(x,p.y,p.size*(1.6-k*.6));}
  else if(p.type==='shard'){ctx.fillStyle=p.color;ctx.fillRect(x,p.y,p.size,p.size);}}}
function drawTextParts(){for(const p of parts)if(p.type==='txt'){ctx.globalAlpha=Math.min(1,p.life/p.max*2);text(p.s,p.x-G.camX,p.y,p.size,p.color);ctx.globalAlpha=1;}}

// ============================================================
//  プレイヤー
// ============================================================
function updatePlayer(p){
  const d=p.def;p.anim++;if(p.inv>0)p.inv--;if(p.flash>0)p.flash--;if(p.knee>0)p.knee--;if(p.spCD>0)p.spCD--;p.justLanded=false;
  if(p.comboT>0)p.comboT--;else p.combo=0;
  const ix=(held.right?1:0)-(held.left?1:0),iz=(held.down?1:0)-(held.up?1:0);
  if(pr('atk'))p.tAtk=T;if(pr('jump'))p.tJump=T;if(held.down)p.tDown=T;
  if(pr('right')){if(T-p.tapR<14)p.dashDir=1;p.tapR=T;}
  if(pr('left')){if(T-p.tapL<14)p.dashDir=-1;p.tapL=T;}
  if(p.dashDir&&ix!==p.dashDir)p.dashDir=0;
  if(p.state==='dead')return;
  if(p.state==='down'){if(updDown(p)){if(p.hp<=0)loseLife();else{p.state='idle';p.inv=70;}}return;}
  if(p.state==='hurt'){airPhys(p);if(--p.hitstun<=0)p.state=p.y>0?'jump':'idle';return;}
  if(G.clearT){if(p.state!=='jump')p.state='idle';p.atk=null;airPhys(p);if(p.justLanded){p.state='idle';p.airAtk=false;}if(p.horse){p.horse.x=p.x;p.horse.z=p.z;p.horse.moving=false;}return;}
  const targets=enemies.concat(props);
  if(p.state==='special'){runAttack(p,targets,true);airPhys(p);p.inv=Math.max(p.inv,2);if(p.atkT>=p.atk.dur){p.state=p.y>0?'jump':'idle';p.atk=null;p.airUsed=true;}return;}
  const both=pr('sp')||((pr('atk')||pr('jump'))&&T-p.tAtk<=3&&T-p.tJump<=3);
  if(both&&p.spCD<=0&&canSpecial(p)){doSpecial(p);return;}
  if(p.horse){updRider(p,ix,iz,targets);return;}
  if(p.state==='grab'){updGrab(p,ix);return;}
  if(p.state==='throwing'){updThrow(p);return;}
  if(p.state==='attack'){
    runAttack(p,targets,true);airPhys(p);
    if(pr('atk'))p.queued=true;
    if(p.atkT>=p.atk.dur){const i=p.step+1;
      if(p.step>=0&&p.queued&&i<d.combo.length)startStep(p,i);
      else{p.state=p.y>0?'jump':'idle';if(p.y>0)p.airUsed=true;p.atk=null;if(p.step>=0&&i<d.combo.length){p.combo=i;p.comboT=18;}else{p.combo=0;p.comboT=0;p.recover=8;}}}
    return;
  }
  if(p.state==='jump'){
    p.jT++;
    if(p.airAtk){if(p.atk.dive){p.vx=p.face*7;p.vy=Math.min(p.vy,-7);}runAttack(p,targets,true);}
    else{if(p.longVX&&ix!==-Math.sign(p.longVX))p.vx=p.longVX;else{p.vx=ix*d.speed*.95;p.longVX=0;}if(ix)p.face=ix;
      if(pr('atk')&&!p.airUsed){p.airUsed=true;p.airAtk=true;p.atk=d.air;p.atkT=0;p.hitSet=new Set();SFX.swing();showMove(d.air.name);}}
    p.z=clamp(p.z+iz*d.speed*.5,ZMIN,ZMAX);
    airPhys(p);
    if(p.justLanded){if(p.airAtk&&p.atk&&p.atk.dive){G.shake=5;dust(p.x,p.z,8);}p.state='idle';p.airAtk=false;p.airUsed=false;p.atk=null;p.recover=4;p.longVX=0;}
    else tryMount(p);
    return;
  }
  if(p.recover>0){p.recover--;airPhys(p);return;}
  airPhys(p);
  if(pr('jump')){p.state='jump';p.jT=0;p.vy=d.jump;p.airUsed=false;p.longVX=p.dashDir?p.dashDir*d.speed*1.9:0;SFX.jump();return;}
  if(pr('atk')){if(ix)p.face=ix;
    if(p.dashDir){startMove(p,d.dash);return;}
    if(held.up&&T-p.tDown<20){startMove(p,d.cmd);return;}
    startStep(p,(p.comboT>0&&p.combo<d.combo.length)?p.combo:0);return;}
  if(ix||iz){const run=p.dashDir&&ix===p.dashDir,sp=d.speed*(run?2:1);
    p.x+=ix*sp;p.z=clamp(p.z+iz*d.speed*.7,ZMIN,ZMAX);if(ix)p.face=ix;p.state=run?'run':'walk';
    if(run&&T%6===0)dust(p.x-ix*20,p.z,1);
    if(ix&&!run&&tryGrab(p,ix))return;
    tryMount(p);
  }else p.state='idle';
}
function canSpecial(p){return['idle','walk','run','grab'].includes(p.state)||(p.state==='attack'&&p.atkT<=6)||(p.state==='jump'&&p.jT<=5)||(!!p.horse&&p.state!=='hurt');}
function doSpecial(p){
  if(p.horse)dismount(p);
  if(p.grab){const e=p.grab;if(e.state==='grabbed'||e.state==='lifted')e.state='idle';p.grab=null;}
  const sp=p.def.special;p.state='special';p.atk=sp;p.atkT=0;p.hitSet=new Set();p.airAtk=false;
  p.hp=Math.max(1,p.hp-6);p.inv=sp.dur;p.spCD=20;p.vx=0;p.vy=sp.hop||0;
  G.flashScreen=8;G.specialT=70;G.specialName=sp.name;G.specialCol=sp.col;SFX.special();
}
function startStep(p,i){const a=p.def.combo[i];if(held.left||held.right)p.face=held.right?1:-1;p.state='attack';p.step=i;p.atk=a;p.atkT=0;p.queued=false;p.hitSet=new Set();showMove(a.name,i);}
function startMove(p,a){p.state='attack';p.step=-1;p.atk=a;p.atkT=0;p.queued=false;p.hitSet=new Set();p.dashDir=0;showMove(a.name);}
// つかみ・投げ
function tryGrab(p,ix){
  for(const e of enemies){
    if(e.def.boss||e.def.noGrab||e.horse||e.hp<=0||e.y>0||e.inv>0)continue;
    if(!(e.state==='idle'||e.state==='walk'||e.state==='hurt'))continue;
    const dx=(e.x-p.x)*ix;
    if(dx>0&&dx<36*SIZE&&Math.abs(e.z-p.z)<10){p.state='grab';p.grab=e;p.grabT=0;p.grabHits=0;p.face=ix;e.state='grabbed';e.atk=null;e.tell=false;e.vx=0;SFX.grab();showMove('つかみ');return true;}
  }
  return false;
}
function updGrab(p,ix){const e=p.grab;p.grabT++;
  if(!e||e.hp<=0||e.state!=='grabbed'){p.state='idle';p.grab=null;return;}
  e.x=p.x+p.face*30*SIZE;e.z=p.z;e.y=0;e.face=-p.face;
  if(pr('atk')){
    if(ix===-p.face){startThrow(p,-p.face);return;}
    if(ix===p.face||p.grabHits>=3){startThrow(p,p.face);return;}
    p.knee=12;p.grabHits++;p.grabT=0;showMove('膝蹴り');
    e.hp-=4;e.flash=6;G.score+=40;G.hits++;G.hitT=80;G.target=e;G.targetT=150;hitFx(e.x-p.face*8,e.z-50*SIZE,false);SFX.hit();G.hitstop=3;
    if(e.hp<=0){e.hp=0;p.state='idle';p.grab=null;knockDown(e,p.face,6);onEnemyKilled(e);}
    return;
  }
  if(p.grabT>110){e.state='idle';e.cd=15;e.vx=p.face*3;p.state='idle';p.grab=null;}
}

function updateEnemy(e){
  const d=e.def;e.anim++;if(e.flash>0)e.flash--;if(e.inv>0)e.inv--;e.tell=false;
  if(e.bossDownCD>0)e.bossDownCD--;if(e.superT>0)e.superT--;if(e.lastHitT>0)e.lastHitT--;else e.stunHits=0;
  if(!e.entered&&e.x>G.camX+10&&e.x<G.camX+W-10)e.entered=true;
  if(!e.entered&&++e.outT>360)e.x=clamp(e.x,G.camX+30,G.camX+W-30);
  if(d.boss&&!e.talked&&e.entered&&!G.clearT){e.talked=true;startTalk(e);}
  if(e.state==='grabbed'||e.state==='lifted'){if(P.grab!==e){e.state='idle';}return;}
  if(e.state==='dying'){if(--e.dieT<=0)e.remove=true;return;}
  if(e.state==='down'){
    if(e.thrown&&e.y>0)for(const o of enemies){if(o===e||o.hp<=0||o.state==='down'||o.state==='dying'||o.state==='grabbed'||o.state==='lifted')continue;
      if(Math.abs(o.x-e.x)<45*SIZE&&Math.abs(o.z-e.z)<18){hitEnemy(e,o,{dmg:10,kb:6,down:1});}}
    if(updDown(e)){if(e.hp<=0){e.state='dying';e.dieT=36;}else{e.state='idle';e.inv=20;e.cd=Math.max(e.cd,30);}}clampE(e);return;}
  if(e.state==='hurt'){airPhys(e);if(--e.hitstun<=0){e.state='idle';e.cd=Math.max(e.cd,20);}clampE(e);return;}
  if(e.horse){updCavalry(e);return;}
  if(e.state==='attack'){
    const a=e.atk;
    if(a.anim==='warp'){const wf=a.warp;e.inv=(e.atkT>wf*.5&&e.atkT<a.dur-wf*.4)?2:0;}
    if(e.atkT<a.hit[0]&&e.atkT>a.hit[0]-14&&(a.dmg>0||a.proj))e.tell=true;
    runAttack(e,[P],false);airPhys(e);clampE(e);
    if(e.atkT>=a.dur){if(a.next&&P.state!=='down'&&P.state!=='dead')startAtk(e,a.next);else{e.state='idle';e.atk=null;e.cd=d.cd*(.6+Math.random()*.8);}}
    return;
  }
  airPhys(e);
  if(e.y>0){clampE(e);return;}
  const dx=P.x-e.x,dz=P.z-e.z,adx=Math.abs(dx)/SIZE;
  e.face=dx>=0?1:-1;
  if(e.cd>0)e.cd--;
  if(d.summon&&!e.summoned&&e.hp<e.maxHp*d.summonAt){e.summoned=true;d.summon.forEach((t,i)=>G.spawnQ.push({t,delay:10+i*30,side:i%2?-1:1}));popText('出合え！ 出合え！',e.x,e.z-200,'#ff8080');}
  const pAvail=P.state!=='down'&&P.state!=='dead'&&!G.clearT;
  if(e.cd<=0&&pAvail&&e.entered){
    const attackers=enemies.filter(o=>o.state==='attack'&&!o.def.boss).length;
    if(d.boss||attackers<2){
      const opts=d.moves.filter(m=>adx>=m.min&&adx<=m.max&&Math.abs(dz)<=m.zt);
      if(opts.length){let tw=0;opts.forEach(m=>tw+=m.w||1);let r=Math.random()*tw;let m=opts[0];for(const o of opts){r-=o.w||1;if(r<=0){m=o;break;}}startAtk(e,m.atk);return;}
    }
  }
  const pref=(pAvail?d.pref:d.pref+90)*SIZE;
  let tx=P.x-e.face*pref;const tz=P.z+(e.cd>30||!pAvail?e.zoff:0);
  tx=clamp(tx,G.camX+40,G.camX+W-40);
  const mx=tx-e.x,mz=tz-e.z;let moving=false;const sp=d.speed;
  if(Math.abs(mx)>6){e.x+=Math.sign(mx)*Math.min(sp,Math.abs(mx));moving=true;}
  if(Math.abs(mz)>3){e.z+=Math.sign(mz)*Math.min(sp*.7,Math.abs(mz));moving=true;}
  for(const o of enemies)if(o!==e&&o.state!=='dying'){const sx=e.x-o.x,sz=e.z-o.z;if(Math.abs(sx)<36&&Math.abs(sz)<14){e.z+=(sz>=0?1:-1)*.6;e.x+=(sx>=0?1:-1)*.4;}}
  e.state=moving?'walk':'idle';
  if(d.jumpy&&moving&&e.entered&&Math.random()<.006)e.vy=10;
  clampE(e);
}
function updCavalry(e){
  const h=e.horse,c=e.cav||(e.cav={mode:'align',t:0,hit:false,dir:1});c.t++;e.anim++;e.state='ride';
  const pAvail=P.state!=='down'&&P.state!=='dead'&&!G.clearT;
  if(c.mode==='align'){
    const side=e.x<P.x?-1:1,tx=side<0?G.camX+90:G.camX+W-90,mx=tx-e.x,mz=P.z-e.z;
    if(Math.abs(mx)>4)e.x+=Math.sign(mx)*Math.min(3.4,Math.abs(mx));if(Math.abs(mz)>3)e.z+=Math.sign(mz)*Math.min(2,Math.abs(mz));
    e.face=-side;h.moving=Math.abs(mx)>4||Math.abs(mz)>3;
    if(pAvail&&e.entered&&c.t>50&&Math.abs(mz)<10&&Math.abs(mx)<14){c.mode='charge';c.t=0;c.hit=false;c.dir=e.face;SFX.neigh();}
  }else{
    e.x+=c.dir*6.5;e.face=c.dir;h.moving=true;
    const rel=(P.x-e.x)*c.dir;
    if(!c.hit&&pAvail&&Math.abs(P.z-e.z)<22*SIZE&&rel>-20&&rel<110*SIZE&&P.y<70){c.hit=true;hitPlayer(e,{dmg:10,kb:7,down:1});}
    if((c.dir>0&&e.x>G.camX+W-80)||(c.dir<0&&e.x<G.camX+80)||c.t>200){c.mode='align';c.t=0;}
  }
  if(h.moving)h.anim+=c.mode==='charge'?2:1;
  clampE(e);h.x=e.x;h.z=e.z;h.face=e.face;
}
function clampE(e){e.z=clamp(e.z,ZMIN,ZMAX);if(e.entered)e.x=clamp(e.x,G.camX+20,G.camX+W-20);}
function startAtk(e,a){e.state='attack';e.atk=a;e.atkT=0;e.hitSet=new Set();e.face=P.x>=e.x?1:-1;
  if(a.leap){const air=Math.round(2*14/GRAV);e.vy=14;e.vx=(P.x-e.x)/air;e.vz=(P.z-e.z)/air;SFX.jump();}
  if(a.hopBack){e.vy=9;e.vx=-e.face*6;}}
function updHorses(){
  for(const h of horses){if(h.flash>0)h.flash--;if(h.rider)continue;h.t++;
    if(h.state==='idle'){if(h.vx){h.x+=h.vx;h.vx*=.9;if(Math.abs(h.vx)<.2)h.vx=0;}h.moving=false;h.y=0;if(h.t>900){h.state='flee';SFX.neigh();}}
    else if(h.state==='flee'){h.x+=h.face*5;h.anim+=2;h.moving=true;if(h.x<G.camX-200||h.x>G.camX+W+200)h.remove=true;}
    if(h.state==='idle'&&G.camX>0)h.x=clamp(h.x,G.camX+40,G.camX+W-40);}
  horses=horses.filter(h=>!h.remove);
}

  ['移動','矢印キー / WASD'],['攻撃','J または Z（連打で連続技）'],['ジャンプ','K / X / スペース（空中で攻撃：空中技）'],
  ['必殺技','攻撃＋ジャンプ同時押し（L / C キーでも可）※体力を少し使う'],['ダッシュ','→→ または ←← と2回押し（ダッシュ中に攻撃で突進技）'],
  ['コマンド技','↓ ↑ ＋ 攻撃'],['つかみ・投げ','敵に歩いて近づくとつかむ → 攻撃で膝蹴り、→/←＋攻撃で投げる'],['騎馬','騎馬武者を落馬させ、空いた馬に触れると乗れる'],
];
function controlsText(y){HELP.forEach((h,i)=>{text(h[0],250,y+i*32,17,'#ffd34d','right',GOTH);text(h[1],268,y+i*32,17,'#fff','left',GOTH);});text('Enter：一時停止　　M：音のオン・オフ',W/2,y+HELP.length*32+8,15,'#ccc');}

// ============================================================
//  タイトル・キャラ選択・地図・エンディング
// ============================================================
function titleBG(){sky(['#2a1036','#9c3b4a','#f08a4b','#f7c873']);glow(480,300,260,'rgba(255,190,90,.6)');circ(480,300,90,'#ffcf70');
  poly([[150,330],[400,130],[460,130],[720,330]],'#3a2240');poly([[400,130],[460,130],[490,160],[460,154],[430,166],[400,152],[372,162]],'#e8dce8');
  castle(800,330,1,'#24121e','#ffb050');hills('#1d0e18',350,10,.01,0,1,0);ctx.fillStyle='#120810';ctx.fillRect(0,345,W,H-345);
  for(let i=0;i<5;i++)nobori(60+i*36,350,'#7a1010',i);}
const titleFig=CHARS.map((c,i)=>({kind:'title',isDemo:true,def:c,look:c.look,state:'walk',anim:i*13,face:1,y:0,scale:c.scale,flash:0,inv:0}));
const titleHorse={kind:'horse',x:0,z:0,face:1,color:'#6b4426',saddle:'#8a1a1a',anim:0,moving:true,flash:0};
function drawTitle(){
  worldLayer(()=>{titleBG();titleHorse.anim++;G0cam();sprite(()=>horseBody(titleHorse),130,480);
    titleFig.forEach((f,i)=>{f.anim++;drawFighter(f,300+i*150,480);});});
  text('戦国',W/2,78,34,'#ffe8b0','center',MIN,'#3a0a0a',6);
  text('天下行脚',W/2,148,100,'#fff','center',MIN,'#7a0d0d',14);
  text('― 西より東へ、魔王討伐の旅 ―',W/2,222,22,'#ffe8b0','center',MIN,'#3a0a0a',5);
  if((T>>5)%2===0)text(isTouch?'画面をタップして始める':'Enter または 攻撃ボタンで始める',W/2,286,24,'#fff','center',GOTH,'#000',5);
  text('移動：矢印/WASD　攻撃：J/Z　ジャンプ：K/X/スペース　必殺：攻撃＋ジャンプ　音：M',W/2,524,14,'#ccc','center',GOTH,'#000',3);
}
function G0cam(){if(!G)G={camX:0};}
function resetDemo(){const c=CHARS[sel];demo={kind:'demo',isDemo:true,def:c,look:c.look,state:'idle',anim:0,atk:null,atkT:0,step:-1,wait:30,face:1,y:0,scale:c.scale,flash:0,inv:0,hitSet:new Set()};}
function updDemo(){const d=demo;d.anim++;
  if(d.state==='attack'||d.state==='special'){d.atkT++;if(d.atkT>=d.atk.dur){d.step++;if(d.step<d.def.combo.length){d.state='attack';d.atk=d.def.combo[d.step];d.atkT=0;}else if(d.step===d.def.combo.length){d.state='special';d.atk=d.def.special;d.atkT=0;}else{d.state='idle';d.atk=null;d.wait=50;}}}
  else if(--d.wait<=0){d.state='attack';d.step=0;d.atk=d.def.combo[0];d.atkT=0;}}
function updSelect(){
  if(!demo)resetDemo();
  if(pr('left')){sel=(sel+3)%4;resetDemo();SFX.sel();}
  if(pr('right')){sel=(sel+1)%4;resetDemo();SFX.sel();}
  if(pr('jump')){scene='title';return;}
  if(confirmPressed()){SFX.ok();startGame(sel);return;}
  updDemo();
}
const selIdle=CHARS.map(c=>({kind:'demo',isDemo:true,def:c,look:c.look,state:'idle',anim:0,face:1,y:0,scale:c.scale,flash:0,inv:0}));
function drawSelect(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1a12');g.addColorStop(1,'#120a06');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  text('武将を選べ',W/2,42,34,'#ffe8b0','center',MIN,'#3a0a0a',6);
  for(let i=0;i<4;i++){const c=CHARS[i],x=33+i*228,y=80,s=i===sel;
    ctx.fillStyle=s?'#4a2a14':'#2a1a10';rr(x,y,210,390,10);ctx.fill();ctx.lineWidth=s?4:2;ctx.strokeStyle=s?'#e8c547':'#5a4030';ctx.stroke();
    drawPortrait(c.look,x+8,y+8,56,56,false);
    text(c.name,x+128,y+26,28,s?'#fff':'#bbb','center',MIN);text(c.title,x+128,y+54,14,s?'#ffd9a0':'#998','center',MIN,null);
    if(s)glow(x+105,y+190,100,'rgba(255,200,120,.25)');
    const f=s?demo:selIdle[i];if(!s)f.anim++;
    ctx.save();ctx.beginPath();ctx.rect(x+2,y+70,206,200);ctx.clip();
    if(s&&demo.state==='special'){glow(x+105,y+190,90,'rgba('+c.special.col+',.5)');}
    drawFighter(f,x+105-(s?16:0),y+258);ctx.restore();
    const labels=['攻撃','速さ','体力'];for(let k=0;k<3;k++){text(labels[k],x+20,y+282+k*18,13,'#ccb','left',GOTH,null);for(let n=0;n<5;n++){ctx.fillStyle=n<c.stats[k]?'#e8c547':'#4a3a2a';ctx.fillRect(x+62+n*26,y+277+k*18,22,10);}}
    ctx.fillStyle='rgba(0,0,0,.3)';rr(x+8,y+332,194,50,6);ctx.fill();
    c.combo.forEach((m,k)=>{const cur=s&&demo.state==='attack'&&demo.step===k;const col=cur?'#ffe27a':s?'#ddd':'#888';const lx=x+14+(k%3)*64,ly=y+344+Math.floor(k/3)*16;text(KANJI[k]+(m.name.length>4?m.name.slice(0,4):m.name),lx,ly,11,col,'left',GOTH,null);});
    const sc=s&&demo.state==='special';text('必殺 '+c.special.name,x+105,y+374,12,sc?'#ffe27a':s?'#ffb08a':'#887','center',GOTH,null);
  }
  const c=CHARS[sel];
  text(c.desc,W/2,492,17,'#fff','center',GOTH,'#000',4);
  text('ダッシュ攻撃：'+c.dash.name+'　／　↓↑＋攻撃：'+c.cmd.name+'　／　空中：'+c.air.name+'　／　必殺：'+c.special.name,W/2,518,14,'#ffe08a','center',GOTH,'#000',3);
  text('←→ で選択　攻撃で決定',W-20,30,13,'#aaa','right',GOTH,null);
}
const travel={kind:'demo',isDemo:true,state:'walk',anim:0,face:1,y:0,scale:.42,flash:0,inv:0};
function drawJapan(){
  ctx.lineCap='round';ctx.lineJoin='round';
  const honshu=[[205,345],[260,330],[330,318],[400,312],[450,300],[500,296],[560,300],[610,300],[660,290],[700,270],[735,240],[760,200],[775,150],[790,100],[800,60],[805,20]];
  const extra=[[[545,292],[560,248]],[[468,305],[480,345]],[[650,298],[655,325]],[[735,255],[748,282]]];
  for(const pass of [[56,'#6a4a22'],[48,'#d8bf88']]){ctx.strokeStyle=pass[1];ctx.lineWidth=pass[0];
    ctx.beginPath();honshu.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    ctx.lineWidth=pass[0]*.55;for(const e of extra)line(e[0][0],e[0][1],e[1][0],e[1][1]);
    const o=pass[0]===56?4:0;ctx.fillStyle=pass[1];
    ell(170,405,38+o,54+o,null,-.3);ell(345,372,56+o,20+o,null,-.1);ell(860,10,70+o,40+o,null);}
}
function updMap(){G.mapT++;travel.anim++;if(G.mapT>70&&confirmPressed()){SFX.ok();beginStage(G.stage);}}
function drawMap(){
  ctx.fillStyle='#e9dcb8';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,100,60,.25)';ctx.lineWidth=2;for(let y=30;y<H;y+=36)for(let x=(y/36%2)*30;x<W;x+=60){ctx.beginPath();ctx.arc(x,y,12,Math.PI*1.1,Math.PI*1.9);ctx.stroke();}
  drawJapan();
  text('日本海',420,190,22,'rgba(90,70,40,.6)','center',MIN,null);text('太平洋',640,450,22,'rgba(90,70,40,.6)','center',MIN,null);
  const s=G.stage;
  ctx.strokeStyle='#a01818';ctx.lineWidth=4;ctx.setLineDash([10,8]);ctx.beginPath();NODES.forEach((n,i)=>i?ctx.lineTo(n[0],n[1]):ctx.moveTo(n[0],n[1]));ctx.stroke();ctx.setLineDash([]);
  NODES.forEach((n,i)=>{const st=STAGES[i];
    if(i<s){circ(n[0],n[1],13,'#a01818');text('平',n[0],n[1]+1,14,'#fff','center',MIN,null);}
    else if(i===s){const r=12+Math.sin(T*.15)*3;circ(n[0],n[1],r+4,'rgba(255,220,80,.5)');circ(n[0],n[1],r,'#e8c547');}
    else circ(n[0],n[1],9,'#7a5a3a');
    text(st.name,n[0]+(i===0?-10:0),n[1]+(i%2||i===0?-30:30),16,i===s?'#7a0d0d':'#4a3a20','center',MIN,'#f4ead0',4);});
  const from=NODES[Math.max(0,s-1)],to=NODES[s],u=s===0?1:clamp(G.mapT/90,0,1);
  travel.def=CHARS[G.char];travel.look=CHARS[G.char].look;travel.state=u<1?'walk':'idle';
  drawFighter(travel,lerp(from[0],to[0],u),lerp(from[1],to[1],u)-12);
  ctx.fillStyle='rgba(30,15,5,.85)';rr(40,436,880,92,10);ctx.fill();
  drawPortrait(CHARS[G.char].look,48,444,76,76,false);
  const st=STAGES[s];
  text(st.chap+'　'+st.name,140,462,22,'#ffe08a','left',MIN,null);
  text(s===0?'時は乱世。魔王・天魔が東国に魔城を築き、天下を闇に染めようとしていた。':st.story,140,492,16,'#fff','left',GOTH,null);
  if(s===0)text(st.story,140,514,14,'#ddd','left',GOTH,null);
  if(G.mapT>70&&(T>>5)%2===0)text(isTouch?'タップで出陣':'攻撃ボタンで出陣',W-60,462,18,'#fff','right',MIN,null);
  text('旅の道のり',W/2,40,30,'#5a2a10','center',MIN,'#f4ead0',5);
}
function updEnding(){G.endT++;if(G.endT>400&&confirmPressed()){scene='title';bgmPlay(3,.22,57);}}
function drawEnding(){
  worldLayer(()=>{sky(['#f6b38a','#fbd9a8','#fff4dc']);glow(480,320,260,'rgba(255,240,200,.9)');circ(480,320,70,'#fff6e0');
    poly([[140,340],[400,140],[460,140],[740,340]],'#8a7aa0');poly([[400,140],[460,140],[492,170],[460,163],[430,176],[400,162],[370,172]],'#fff');
    ctx.fillStyle='#5a6a48';ctx.fillRect(0,340,W,H-340);
    const f={kind:'demo',isDemo:true,def:CHARS[G.char],look:CHARS[G.char].look,state:'idle',anim:T,face:1,y:0,scale:CHARS[G.char].scale*1.3,flash:0,inv:0};drawFighter(f,200,470);});
  const lines=['魔王・天魔は討たれ、魔城は朝日の中に崩れ落ちた。','西の果て肥前より始まった長い旅は、ここに終わる。',CHARS[G.char].name+'の名は、天下に泰平をもたらした英雄として','末永く語り継がれたという――。'];
  lines.forEach((l,i)=>{const a=clamp((G.endT-i*70)/50,0,1);ctx.globalAlpha=a;text(l,580,110+i*42,20,'#3a1a0a','center',MIN,'#fff6e0',4);});ctx.globalAlpha=1;
  if(G.endT>320){text('― 完 ―',580,320,44,'#7a0d0d','center',MIN,'#fff6e0',6);text('最終得点　'+G.score,580,380,24,'#3a1a0a','center',GOTH,'#fff6e0',4);if(G.continues)text('コンティニュー '+G.continues+' 回',580,412,16,'#5a3a2a','center',GOTH,null);}
  if(G.endT>400&&(T>>5)%2===0)text('攻撃ボタンでタイトルへ',580,470,18,'#3a1a0a','center',GOTH,'#fff6e0',4);
}

// ============================================================
//  メインループ
// ============================================================
function update(){poll();T++;bgmTick();
  switch(scene){
    case 'title':if(confirmPressed()||pr('jump')){audioInit();SFX.ok();scene='select';resetDemo();bgmPlay(9,.18,60);}break;
    case 'select':updSelect();break;
    case 'map':updMap();break;
    case 'play':updPlay();break;
    case 'ending':updEnding();break;
  }
  tapped=false;
}
function render(){ctx=mctx;mctx.setTransform(1,0,0,1,0,0);mctx.globalAlpha=1;mctx.imageSmoothingEnabled=false;
  switch(scene){case 'title':drawTitle();break;case 'select':drawSelect();break;case 'map':drawMap();break;case 'play':drawPlay();break;case 'ending':drawEnding();break;}}
let last=performance.now(),acc=0;
function loop(ts){requestAnimationFrame(loop);acc+=Math.min(100,ts-last);last=ts;let n=0;
  try{while(acc>=1000/60&&n<4){update();acc-=1000/60;n++;}render();}catch(e){console.error(e);acc=0;ctx=mctx;}}
bgmPlay(3,.22,57);
requestAnimationFrame(loop);
</script>
